name: Glasgow–Blatchford CI

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q glasgow_blatchford.py agents tests enrichment.py
      - name: Python regression suite
        run: python -m pytest -q
      - name: Browser calculation regression suite
        run: node --test web/gbs.test.cjs
      - name: Check browser scripts
        run: node --check web/gbs.js
      - name: Check audit verification
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

services:
  glasgow-blatchford-bleeding-score:
    build: .
    container_name: glasgow-blatchford-bleeding-score
    ports:
      - "8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set a strong AUDIT_SECRET_KEY environment variable}
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
